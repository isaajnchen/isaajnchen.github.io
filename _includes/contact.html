<!-- SECTION 4: Contact -->
<section id="contact" class="contact-section" style="max-width: 600px; margin: 0 auto; padding: 2rem 1rem;">
  <h2 style="text-align: center; font-size: 2rem; margin-bottom: 2rem; font-weight: 700;">Contact</h2>
  
  <div class="group">
    <form action="https://formspree.io{{site.formspree-key}}" method="POST" style="display: flex; flex-direction: column; gap: 1.5rem;">
      
      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="name" style="font-weight: 600; font-size: 0.95rem; color: #333;">Name</label>
        <input type="text" id="name" name="name" style="padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; width: 100%; box-sizing: border-box;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="email" style="font-weight: 600; font-size: 0.95rem; color: #333;">Email</label>
        <input type="email" id="email" name="email" style="padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; width: 100%; box-sizing: border-box;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.5rem;">
        <label for="message" style="font-weight: 600; font-size: 0.95rem; color: #333;">Message</label>
        <textarea id="message" name="message" rows="6" style="padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
      </div>

      <button type="submit" style="background-color: #4285f4; color: white; border: none; padding: 0.85rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer;">
        Send Message
      </button>
      
    </form>
  </div>
</section>
